# NGINX Configuration for RTMP Streaming
# This configuration provides:
# - RTMP server for OBS streaming
# - HLS output for web playback
# - Authentication with backend API
# - Recording capabilities
# - Multiple quality transcoding

worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load RTMP module
load_module modules/ngx_rtmp_module.so;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

# HTTP block for web server and API
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # CORS headers for HLS
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
    add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    add_header Access-Control-Expose-Headers 'Content-Length,Content-Range';

    # HLS streaming server
    server {
        listen 80;
        server_name _;

        # HLS files location
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var/www/html;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        }

        # Recordings location
        location /recordings {
            root /var/www/html;
            autoindex on;
            add_header Access-Control-Allow-Origin *;
        }

        # RTMP statistics
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
            add_header Access-Control-Allow-Origin *;
        }

        location /stat.xsl {
            root /usr/share/nginx/html;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # SSL server (uncomment and configure for production)
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #     
    #     ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    #     
    #     # SSL configuration
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     
    #     # HLS files location
    #     location /hls {
    #         types {
    #             application/vnd.apple.mpegurl m3u8;
    #             video/mp2t ts;
    #         }
    #         root /var/www/html;
    #         add_header Cache-Control no-cache;
    #         add_header Access-Control-Allow-Origin *;
    #     }
    # }
}

# RTMP block for streaming
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        allow publish all;
        allow play all;

        # Live streaming application
        application live {
            live on;
            
            # Authentication
            on_publish http://localhost:5000/api/livestream/auth;
            on_publish_done http://localhost:5000/api/livestream/start;
            on_done http://localhost:5000/api/livestream/end;

            # HLS settings
            hls on;
            hls_path /var/www/html/hls;
            hls_fragment 3;
            hls_playlist_length 60;
            hls_continuous on;
            hls_cleanup on;
            hls_nested on;

            # HLS variants for different qualities
            hls_variant _low BANDWIDTH=160000;
            hls_variant _mid BANDWIDTH=320000;
            hls_variant _high BANDWIDTH=640000;

            # Recording
            record all;
            record_path /var/recordings;
            record_unique on;
            record_suffix .flv;
            record_append on;

            # Transcoding for different qualities
            exec ffmpeg -i rtmp://localhost/live/$name
                -c:a aac -b:a 64k -c:v libx264 -b:v 128k -f flv rtmp://localhost/hls/$name_low
                -c:a aac -b:a 128k -c:v libx264 -b:v 256k -f flv rtmp://localhost/hls/$name_mid
                -c:a aac -b:a 192k -c:v libx264 -b:v 512k -f flv rtmp://localhost/hls/$name_high;
        }

        # HLS playback application
        application hls {
            live on;
            hls on;
            hls_path /var/www/html/hls;
            hls_fragment 3;
            hls_playlist_length 60;
            hls_continuous on;
            hls_cleanup on;
            hls_nested on;
        }

        # Playback application for testing
        application playback {
            live on;
            play /var/recordings;
        }
    }
}